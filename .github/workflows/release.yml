name: Build and Release

on:
  schedule:
    # Daily at 09:23 JST (00:23 UTC).
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: winmerge-anydoc-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test release automation
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Build release
        shell: pwsh
        run: cargo build --release --locked

      - name: Test plugin
        run: cargo test --locked

  release:
    if: >-
      github.repository == 'namulab/winmerge-anydoc' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Reruns should see the latest main, including a previous update commit.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'main' }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test release automation
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check anydoc or resume release
        id: prepare
        shell: pwsh
        run: |
          if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
            python scripts/auto_release.py prepare --tag $env:GITHUB_REF_NAME
          } else {
            python scripts/auto_release.py prepare
          }

      - name: Build release
        if: steps.prepare.outputs.release == 'true'
        shell: pwsh
        run: cargo build --release --locked

      - name: Test plugin
        if: steps.prepare.outputs.release == 'true'
        run: cargo test --locked

      - name: Install license generator
        if: steps.prepare.outputs.changed == 'true'
        run: cargo install cargo-about --version 0.9.1 --features cli --locked

      - name: Update third-party notices
        if: steps.prepare.outputs.changed == 'true'
        run: cargo about generate --locked --fail about.hbs -o THIRD_PARTY_NOTICES.md

      - name: Package
        if: steps.prepare.outputs.release == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          $packageName = "winmerge-anydoc-$env:RELEASE_TAG"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "target\release\compare_office_with_anydoc.dll" $packageDir
          Copy-Item "LICENSE" $packageDir
          Copy-Item "THIRD_PARTY_NOTICES.md" $packageDir
          Copy-Item "README.md" $packageDir
          Copy-Item "README.ja.md" $packageDir

          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath

      - name: Commit update and tag
        if: steps.prepare.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: python scripts/auto_release.py commit --tag $env:RELEASE_TAG

      # GITHUB_TOKEN pushes do not trigger another push workflow, so publish here.
      - name: Publish GitHub Release
        if: steps.prepare.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: python scripts/auto_release.py publish --tag $env:RELEASE_TAG
